name: Validate skill collection

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Retain a private Node foundation for observer checks
        run: node .github/scripts/isolate-node-runtime.mjs
      - name: Install locked Node.js dependencies
        run: npm ci
      - name: Run local Node.js checks and isolated regression tests
        run: npm run check
      - name: Verify the compiled local package without publishing
        run: npm run package:check
      - name: Set up Python for the external official validator only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate every canonical skill with the pinned official tool
        run: |
          python3 -I -m venv .work/validation-env
          npm run ci:official
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --check --oneline "$HEAD_SHA"
          fi
