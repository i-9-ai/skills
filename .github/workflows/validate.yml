name: Validate skill collection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate repository
        run: python3 scripts/validate_repository.py
      - name: Install pinned official validator in an isolated environment
        run: |
          python3 -m venv .work/validation-env
          node scripts/install_validation.mjs
          echo "$GITHUB_WORKSPACE/.work/validation-env/bin" >> "$GITHUB_PATH"
      - name: Validate every canonical skill with skills-ref
        run: node scripts/validate_skills.mjs
      - name: Run isolated regression tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test_validate_skills.mjs
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --check --oneline "$HEAD_SHA"
          fi
