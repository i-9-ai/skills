name: Publish visual guides

on:
  push:
    branches: [main]
    paths:
      - "docs/assets/**"
      - "docs/diagrams/**"
      - ".github/workflows/publish-visual-guides.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the merged documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Publish the visual guide site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          trap 'git config --global --unset-all http.https://github.com/.extraheader || true' EXIT
          if git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://github.com/${REPOSITORY}.git" .pages
          else
            git init --initial-branch=gh-pages .pages
            git -C .pages remote add origin "https://github.com/${REPOSITORY}.git"
          fi
          rsync -a --delete --exclude='.git' --exclude='*.visual-check.*' docs/assets/ .pages/
          cd .pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --quiet --staged; then
            echo "Visual guide site is already synchronized."
            exit 0
          fi
          git commit -m "docs: publish visual guides"
          git push --set-upstream origin gh-pages
