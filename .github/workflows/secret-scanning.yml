name: Detect credential patterns

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scanning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact contribution head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js for the bounded scan helper
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download and verify the pinned detector
        run: |
          TOOL_DIR="$RUNNER_TEMP/i9-gitleaks"
          mkdir -p "$TOOL_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$TOOL_DIR/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | (cd "$TOOL_DIR" && sha256sum --check --status)
          tar -xzf "$TOOL_DIR/gitleaks.tar.gz" -C "$TOOL_DIR" gitleaks
          echo "GITLEAKS_BINARY=$TOOL_DIR/gitleaks" >> "$GITHUB_ENV"
      - name: Verify synthetic rejection and harmless example acceptance
        run: node .github/scripts/secret-scan.mjs --self-test
      - name: Scan the complete event range and tracked head tree
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/secret-scan.mjs
