name: Validate pending release notes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate pending notes or a complete prepared version
        env:
          CHANGESET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if npm run changeset:status -- --since="$CHANGESET_BASE"; then
            exit 0
          fi

          npm run release:verify -- --base "$CHANGESET_BASE"
