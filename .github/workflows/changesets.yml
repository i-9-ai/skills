name: Validate pending release notes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate pending notes or a complete prepared version
        env:
          CHANGESET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if npm run changeset:status -- --since="$CHANGESET_BASE"; then
            exit 0
          fi

          npm run release:verify -- --base "$CHANGESET_BASE"
