name: Prepare version pull request

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-preparation
  cancel-in-progress: false

jobs:
  prepare-version:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check for pending notes locally
        id: notes
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, lstatSync, readdirSync } from 'node:fs';

          const directory = lstatSync('.changeset');
          if (!directory.isDirectory() || directory.isSymbolicLink()) {
            throw new Error('Expected a regular .changeset directory.');
          }

          const entries = readdirSync('.changeset', { withFileTypes: true });
          if (entries.length > 4096) {
            throw new Error('The pending-note directory exceeds the supported entry limit.');
          }

          const notes = entries.filter((entry) => entry.name.endsWith('.md') && entry.name !== 'README.md');
          if (notes.some((entry) => !entry.isFile())) {
            throw new Error('Pending notes must be regular Markdown files.');
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `pending=${notes.length > 0}\n`);
          if (notes.length === 0) {
            console.log('No pending Changesets; no version pull request will be created.');
          }
          NODE
      - name: Check the local Changesets release plan
        id: plan
        if: steps.notes.outputs.pending == 'true'
        run: |
          npm run changeset:status -- --output "$RUNNER_TEMP/i9-release-plan.json"

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const plan = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'i9-release-plan.json'), 'utf8'));
          if (!Array.isArray(plan.releases)) {
            throw new Error('Changesets did not return a release plan.');
          }

          const version = plan.releases.some((release) => ['major', 'minor', 'patch'].includes(release.type));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          if (!version) {
            console.log('No package version is planned; notes remain for a later release.');
          }
          NODE
      - name: Create or update the draft version pull request
        if: steps.plan.outputs.version == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run release:prepare
          pr-draft: always
          pr-base-branch: ${{ github.event.repository.default_branch }}
          commit-message: 'chore: prepare package and plugin version'
          pr-title: 'chore: prepare package and plugin version'
