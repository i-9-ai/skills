name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sync-wiki.yml"
      - "src/repository/WikiMirrorRepository.ts"
      - "src/service/WikiLinkService.ts"
      - ".agents/skills/skill-authoring/scripts/lib/contracts.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify the Wiki is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_wiki')" != true ]; then
            echo "::error::Enable the repository Wiki and create its first page before synchronizing docs."
            exit 1
          fi
      - name: Clone and synchronize the Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" \
            clone --depth 1 "https://github.com/${REPOSITORY}.wiki.git" .wiki
          node --input-type=module <<'NODE'
          import { WikiMirrorRepository } from './src/repository/WikiMirrorRepository.ts';
          new WikiMirrorRepository().synchronize('docs', '.wiki', process.env.REPOSITORY);
          NODE
          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --quiet --staged; then
            echo "Wiki is already synchronized."
            exit 0
          fi
          git commit -m "docs: synchronize Wiki from main"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" push
