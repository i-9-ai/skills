name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Wiki write token
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -z "$WIKI_SYNC_TOKEN" ]; then
            echo "::error::Set the WIKI_SYNC_TOKEN Actions secret before synchronizing the GitHub Wiki."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Clone and synchronize the Wiki
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_SYNC_TOKEN" | base64 -w 0)"
          trap 'git config --global --unset-all http.https://github.com/.extraheader || true' EXIT
          if ! git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.wiki.git" >/dev/null 2>&1; then
            echo "::error::Initialize the GitHub Wiki with its first page before synchronizing it."
            exit 1
          fi
          git clone "https://github.com/${REPOSITORY}.wiki.git" .wiki
          rsync -a --delete --exclude='.git' docs/ .wiki/
          python3 - <<'PY'
          import os
          import posixpath
          import re
          from pathlib import Path

          repository = os.environ['REPOSITORY']
          wiki_root = Path('.wiki')
          link = re.compile(r'(?P<prefix>\]\()(?P<target>\.\./[^)\s]+)')

          def rewrite_markdown(body, replace):
              output = []
              fence = None
              for line in body.splitlines(keepends=True):
                  marker = re.match(r'\s{0,3}(`{3,}|~{3,})', line)
                  if marker:
                      run = marker.group(1)
                      if fence is None:
                          fence = run
                      elif run[0] == fence[0] and len(run) >= len(fence):
                          fence = None
                      output.append(line)
                      continue
                  if fence is not None:
                      output.append(line)
                      continue
                  cursor = 0
                  while cursor < len(line):
                      tick = line.find('`', cursor)
                      if tick == -1:
                          output.append(link.sub(replace, line[cursor:]))
                          break
                      output.append(link.sub(replace, line[cursor:tick]))
                      width = 1
                      while tick + width < len(line) and line[tick + width] == '`':
                          width += 1
                      marker = '`' * width
                      end = line.find(marker, tick + width)
                      if end == -1:
                          output.append(line[tick:])
                          break
                      output.append(line[tick:end + width])
                      cursor = end + width
              return ''.join(output)

          for page in wiki_root.rglob('*.md'):
              source = Path('docs') / page.relative_to(wiki_root)
              body = page.read_text(encoding='utf-8')

              def replace(match):
                  target = match.group('target')
                  destination, separator, fragment = target.partition('#')
                  resolved = posixpath.normpath(posixpath.join(source.parent.as_posix(), destination))
                  if resolved.startswith('../') or resolved == '..':
                      raise ValueError(f'Wiki link escapes the repository: {target}')
                  url = f'https://github.com/{repository}/blob/main/{resolved}'
                  if separator:
                      url += f'#{fragment}'
                  return f'{match.group("prefix")}{url}'

              page.write_text(rewrite_markdown(body, replace), encoding='utf-8')
          PY
          if [ -f .wiki/index.md ] && { [ -e .wiki/Home.md ] || [ -L .wiki/Home.md ]; }; then
            echo "Wiki Home collision: docs contains both index.md and Home.md."
            exit 1
          fi
          if [ -f .wiki/index.md ]; then
            mv .wiki/index.md .wiki/Home.md
          fi
          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --quiet --staged; then
            echo "Wiki is already synchronized."
            exit 0
          fi
          git commit -m "docs: synchronize Wiki from main"
          git push
