name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sync-wiki.yml"
      - "src/repository/WikiMirrorRepository.ts"
      - "src/service/WikiLinkService.ts"
      - ".agents/skills/skill-authoring/scripts/lib/contracts.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Clone and synchronize the Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" \
            clone --depth 1 "https://github.com/${REPOSITORY}.wiki.git" .wiki
          rsync -a --delete --exclude='.git' docs/ .wiki/
          node --input-type=module <<'NODE'
          import { WikiMirrorRepository } from './src/repository/WikiMirrorRepository.ts';
          new WikiMirrorRepository().rewrite('.wiki', process.env.REPOSITORY);
          NODE
          if [ ! -f .wiki/Home.md ]; then
            echo "::error::The documentation mirror must include Home.md."
            exit 1
          fi
          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --quiet --staged; then
            echo "Wiki is already synchronized."
            exit 0
          fi
          git commit -m "docs: synchronize Wiki from main"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" push
