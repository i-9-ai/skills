name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sync-wiki.yml"
      - "src/repository/WikiMirrorRepository.ts"
      - "src/service/WikiLinkService.ts"
      - ".agents/skills/skill-authoring/scripts/lib/contracts.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Wiki write token
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -z "$WIKI_SYNC_TOKEN" ]; then
            echo "::error::Set the WIKI_SYNC_TOKEN Actions secret before synchronizing the GitHub Wiki."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Clone and synchronize the Wiki
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_SYNC_TOKEN" | base64 -w 0)"
          trap 'git config --global --unset-all http.https://github.com/.extraheader || true' EXIT
          if ! git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.wiki.git" >/dev/null 2>&1; then
            echo "::error::Initialize the GitHub Wiki with its first page before synchronizing it."
            exit 1
          fi
          git clone "https://github.com/${REPOSITORY}.wiki.git" .wiki
          rsync -a --delete --exclude='.git' docs/ .wiki/
          node --input-type=module <<'NODE'
          import { WikiMirrorRepository } from './src/repository/WikiMirrorRepository.ts';
          new WikiMirrorRepository().rewrite('.wiki', process.env.REPOSITORY);
          NODE
          if [ -f .wiki/index.md ] && { [ -e .wiki/Home.md ] || [ -L .wiki/Home.md ]; }; then
            echo "Wiki Home collision: docs contains both index.md and Home.md."
            exit 1
          fi
          if [ -f .wiki/index.md ]; then
            mv .wiki/index.md .wiki/Home.md
          fi
          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --quiet --staged; then
            echo "Wiki is already synchronized."
            exit 0
          fi
          git commit -m "docs: synchronize Wiki from main"
          git push
