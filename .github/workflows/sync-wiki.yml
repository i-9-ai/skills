name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Wiki write token
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -z "$WIKI_SYNC_TOKEN" ]; then
            echo "::error::Set the WIKI_SYNC_TOKEN Actions secret before synchronizing the GitHub Wiki."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Clone and synchronize the Wiki
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_SYNC_TOKEN" | base64 -w 0)"
          trap 'git config --global --unset-all http.https://github.com/.extraheader || true' EXIT
          if ! git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.wiki.git" >/dev/null 2>&1; then
            echo "::error::Initialize the GitHub Wiki with its first page before synchronizing it."
            exit 1
          fi
          git clone "https://github.com/${REPOSITORY}.wiki.git" .wiki
          rsync -a --delete --exclude='.git' docs/ .wiki/
          python3 - <<'PY'
          import os
          import posixpath
          import re
          from pathlib import Path

          repository = os.environ['REPOSITORY']
          wiki_root = Path('.wiki')
          link = re.compile(r'(?P<prefix>\]\()(?P<target>\.\./[^)\s]+)')

          for page in wiki_root.rglob('*.md'):
              source = Path('docs') / page.relative_to(wiki_root)
              body = page.read_text(encoding='utf-8')

              def replace(match):
                  target = match.group('target')
                  destination, separator, fragment = target.partition('#')
                  resolved = posixpath.normpath(posixpath.join(source.parent.as_posix(), destination))
                  if resolved.startswith('../') or resolved == '..':
                      raise ValueError(f'Wiki link escapes the repository: {target}')
                  url = f'https://github.com/{repository}/blob/main/{resolved}'
                  if separator:
                      url += f'#{fragment}'
                  return f'{match.group("prefix")}{url}'

              page.write_text(link.sub(replace, body), encoding='utf-8')
          PY
          if [ -f .wiki/index.md ]; then
            mv .wiki/index.md .wiki/Home.md
          fi
          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --quiet --staged; then
            echo "Wiki is already synchronized."
            exit 0
          fi
          git commit -m "docs: synchronize Wiki from main"
          git push
