name: Add Dependabot Changesets

on:
  workflow_run:
    workflows: [Validate pending release notes]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Open Dependabot pull request number to backfill
        required: true
        type: string

permissions: {}

concurrency:
  group: dependabot-changesets-${{ github.event.workflow_run.head_branch || inputs.pull-request }}
  cancel-in-progress: false

jobs:
  changeset:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.actor.login == 'dependabot[bot]' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js without dependency caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Add a missing Changeset through the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/dependabot-changesets.mjs
